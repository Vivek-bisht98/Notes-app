<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Note</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:100%;
            max-width:700px;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        h1{
            color:#222;
            margin-bottom:20px;
            word-break:break-word;
        }

        .content{
            color:#555;
            font-size:17px;
            line-height:1.8;
            white-space:pre-wrap;
            margin-bottom:35px;
        }

        .buttons{
            display:flex;
            justify-content:space-between;
            gap:10px;
        }

        .btn{
            flex:1;
            text-align:center;
            text-decoration:none;
            color:white;
            padding:12px;
            border-radius:8px;
            font-weight:bold;
            transition:.3s;
        }

        .back{
            background:#6b7280;
        }

        .back:hover{
            background:#4b5563;
        }

        .edit{
            background:#f59e0b;
        }

        .edit:hover{
            background:#d97706;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>{{ note.title }}</h1>

    <div class="content">
        {{ note.content }}
    </div>

    <div class="buttons">

        <a href="{% url 'home' %}" class="btn back">
            ← Back
        </a>

        <a href="{% url 'edit_note' note.id %}" class="btn edit">
            ✏ Edit Note
        </a>

    </div>

</div>

</body>
</html>
