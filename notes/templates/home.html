<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            padding:40px;
        }

        .container{
            max-width:1000px;
            margin:auto;
        }

        h1{
            text-align:center;
            color:#222;
        }

        .subtitle{
            text-align:center;
            color:#666;
            margin-top:10px;
            margin-bottom:30px;
        }

        .create-btn{
            display:block;
            width:180px;
            margin:0 auto 40px;
            padding:12px;
            background:#2563eb;
            color:white;
            text-align:center;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
            transition:.3s;
        }

        .create-btn:hover{
            background:#1d4ed8;
        }

        .notes-title{
            margin-bottom:20px;
        }

        .note-card{
            background:white;
            border-radius:10px;
            box-shadow:0 3px 10px rgba(0,0,0,.1);
            padding:20px;
            margin-bottom:20px;
        }

        .note-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
        }

        .note-info{
            flex:1;
        }

        .note-info h3{
            color:#222;
            margin-bottom:8px;
        }

        .note-info p{
            color:#555;
        }

        .actions{
            display:flex;
            gap:10px;
        }

        .btn{
            padding:8px 14px;
            border:none;
            border-radius:6px;
            color:white;
            text-decoration:none;
            font-size:14px;
            transition:.3s;
        }

        .edit{
            background:#f59e0b;
        }

        .view{
            background:#10b981;
        }

        .delete{
            background:#ef4444;
        }

        .btn:hover{
            opacity:.85;
        }

        .empty{
            text-align:center;
            color:#666;
            margin-top:40px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📝 Notes App</h1>

    <p class="subtitle">
        Create, view, edit and manage your notes easily.
    </p>

    <a href="{% url 'create_note' %}" class="create-btn">
        + Create Note
    </a>

    <h2 class="notes-title">Your Notes</h2>

    {% if notes %}

        {% for note in notes %}

        <div class="note-card">

            <div class="note-header">

                <div class="note-info">

                    <h3>{{ note.title }}</h3>

                    <p>{{ note.content }}</p>

                </div>

                <div class="actions">

                    <a href="{% url 'view_note' note.id %}" class="btn view">
                        View
                    </a>

                    <a href="{% url 'edit_note' note.id %}" class="btn edit">
                        Edit
                    </a>

                    <a href="{% url 'delete_note' note.id %}" class="btn delete">
                        Delete
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    {% else %}

        <p class="empty">
            No notes found. Create your first note!
        </p>

    {% endif %}

</div>

</body>
</html>
